# Audi: bereik, tank of accu, kilometerstand, slot, deuren en ramen, laden en parkeerplek van je Audi via myAudi.
# Onofficieel: dezelfde weg als de myAudi-app (protocolkennis uit audi_connect_ha, MIT). Alleen lezen.
# De gebruiker vult zijn e-mailadres en wachtwoord van myAudi in; de app bewaart alleen de tokens (opslag:klein).
manifest: 1
id: audi
naam: Audi
versie: 1.2.0
auteur:
  naam: openBolle
  email: plugins@openbolle.nl
  github: openbolle
  url: https://openbolle.nl
licentie: MIT
beschrijving:
  kort: Bereik, tank of accu van je Audi
  lang: >
    Zie hoe ver je Audi nog komt, hoe vol de tank of accu is, of hij op slot staat, of er een raam open is, of hij
    laadt en waar hij geparkeerd staat. Vraag het aan Bolle, open de app op Bolle of zie de tank of accu op je
    beginscherm; Bolle meldt het als je Audi klaar is met laden. Werkt met je myAudi-account (Europa), via de
    onofficiële weg van de myAudi-app: Audi kan die zonder waarschuwing veranderen. Alleen lezen; op slot doen of de
    klimaatregeling aanzetten kan nog niet. De auto wordt nooit gewekt.
categorie: auto
pictogram: auto
logo: logo.png
voorbeelden:
  - Hoe ver kom ik nog met de Audi?
  - Staat de auto op slot?
  - Laadt de Audi nog?
  - Waar staat mijn auto?

vereist:
  bolleos: ">=0.3.5"
  platform: ">=1.0 <2"
  blokken: 1

runtime:
  taal: node
  geheugen_mb: 64
  cpu: 0.1
  tijdslimiet_ms: 8000
  opslag_kb: 8

rechten:
  - spraak:tools
  - blokken:tonen
  - meldingen:sturen        # bij een vraag: niet op slot of een raam open; uit zichzelf: klaar met laden
  - netwerk:uitgaand
  - opslag:klein

netwerk:
  uitgaand:
    - group.identity.vwgroup.io:443      # inloggen en tokens verversen (Auth0 van de VW Group, zoals de myAudi-app)
    - emea.bff.cariad.digital:443        # stand en parkeerplek van de auto (CARIAD)
    - app-api.live-my.audi.com:443       # de lijst met auto's in je account (één keer)

instellingen:
  - sleutel: email
    type: tekst
    label: E-mailadres van myAudi
    uitleg: Het e-mailadres waarmee je inlogt in de myAudi-app.
    verplicht: true
    patroon: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  - sleutel: wachtwoord
    type: geheim
    label: Wachtwoord van myAudi
    uitleg: Alleen om in te loggen bij myAudi. openBolle bewaart het versleuteld en zet het nooit in een log.
    verplicht: true
  - sleutel: vin
    type: tekst
    label: VIN (alleen bij meer auto's)
    uitleg: Heb je meer dan één auto in myAudi? Vul dan het chassisnummer (17 tekens) in van de auto die Bolle moet tonen.
    patroon: "^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$"

tools:
  - naam: auto_status
    beschrijving: >
      Hoe het met de Audi van de gebruiker staat: bereik in km, tank of accu in procent, kilometerstand, of hij op slot
      staat en of er deuren of ramen open zijn, met de tijd waarop de auto dit doorgaf. Voor vragen als "hoe ver kom ik
      nog", "staat de auto op slot", "is er een raam open". Niet voor de plek van de auto.
    parameters:
      type: object
      properties: {}
    rijden: true
    max_tekens: 500
  - naam: laadstatus
    beschrijving: >
      Laden van een elektrische Audi of plug-in hybride: accu in procent, of hij aan de lader zit en laadt, met welk
      vermogen, wanneer hij vol is en het laaddoel. Voor vragen als "laadt de auto nog" of "hoe vol is de accu".
    parameters:
      type: object
      properties: {}
    rijden: true
    max_tekens: 400
  - naam: waar_staat_mijn_auto
    beschrijving: >
      Waar de Audi van de gebruiker geparkeerd staat, als coördinaten afgerond op ongeveer 100 meter, en sinds wanneer.
      Geeft geen straat of plaatsnaam. Rijdt de auto, dan is er geen parkeerplek.
    parameters:
      type: object
      properties: {}
    rijden: true
    max_tekens: 300

blokken:
  - id: audi
    soort: tegel
    titel: Audi
    pictogram: auto
    verversen_s: 900
    rijden: eenregel
    hoofdscherm: true

privacy:
  doel: De stand van je eigen Audi tonen en op je vragen antwoorden (bereik, tank of accu, slot, deuren en ramen, laden, parkeerplek).
  gegevens:
    - Je e-mailadres en wachtwoord van myAudi (het wachtwoord versleuteld bij openBolle), alleen om in te loggen
    - De toegang tot myAudi (tokens), de laatst bekende stand van je auto, het chassisnummer (VIN) en de naam van de auto, in de opslag van de app
    - De parkeerplek alleen tijdens je vraag, niet bewaard
  bewaartermijn: Tot je de app verwijdert; dan wordt alles gewist. De bewaarde stand wordt elke keer overschreven.
  derden:
    - naam: AUDI AG en CARIAD SE (Volkswagen Group)
      land: DE
      waarom: inloggen bij myAudi en de gegevens van je auto ophalen
      privacyverklaring: https://www.audi.nl/nl/web/nl/privacy.html

presentatie:
  documentatie: handleiding.md
